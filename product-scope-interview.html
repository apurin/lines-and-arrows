<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lines &amp; Arrows — v1 scope interview</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/gh/apurin/interview-harness@v5.2.0/interview-harness.js"></script>
    <script>
      const shell = (content) => `
        <div style="height:250px;box-sizing:border-box;padding:14px;background:#f7f8fa;color:#20252b;font:12px/1.35 Inter,ui-sans-serif,system-ui,sans-serif">
          <div style="height:100%;box-sizing:border-box;overflow:hidden;border:1px solid #d9dde3;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(24,32,44,.07)">
            ${content}
          </div>
        </div>`;

      const toolbar = (active = "Diagram") => `
        <div style="height:34px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid #e7e9ed;color:#727982">
          <span style="font-weight:700;color:#252b32">Checkout flow</span>
          <span style="padding:3px 7px;border-radius:6px;background:${active === "Diagram" ? "#e9f1ff" : "transparent"};color:${active === "Diagram" ? "#2559a7" : "#727982"}">Diagram</span>
          <span style="padding:3px 7px;border-radius:6px;background:${active === "Source" ? "#e9f1ff" : "transparent"};color:${active === "Source" ? "#2559a7" : "#727982"}">Source</span>
          <span style="margin-left:auto">↶&nbsp;&nbsp;↷&nbsp;&nbsp;＋</span>
        </div>`;

      const diagram = (selected = true) => `
        <svg viewBox="0 0 430 176" width="100%" height="176" role="img" aria-label="A customer calls an API which queries an inventory service">
          <defs>
            <marker id="scope-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5965"></path>
            </marker>
          </defs>
          <rect x="30" y="12" width="88" height="28" rx="7" fill="#f4f6f8" stroke="#cbd1d8"></rect>
          <rect x="171" y="12" width="88" height="28" rx="7" fill="#f4f6f8" stroke="#cbd1d8"></rect>
          <rect x="312" y="12" width="88" height="28" rx="7" fill="#f4f6f8" stroke="#cbd1d8"></rect>
          <text x="74" y="30" text-anchor="middle" fill="#2b3138" font-size="11">Customer</text>
          <text x="215" y="30" text-anchor="middle" fill="#2b3138" font-size="11">API</text>
          <text x="356" y="30" text-anchor="middle" fill="#2b3138" font-size="11">Inventory</text>
          <line x1="74" y1="40" x2="74" y2="164" stroke="#c8cdd4" stroke-dasharray="4 4"></line>
          <line x1="215" y1="40" x2="215" y2="164" stroke="#c8cdd4" stroke-dasharray="4 4"></line>
          <line x1="356" y1="40" x2="356" y2="164" stroke="#c8cdd4" stroke-dasharray="4 4"></line>
          <line x1="78" y1="70" x2="210" y2="70" stroke="${selected ? "#2563eb" : "#4f5965"}" stroke-width="${selected ? "2" : "1.4"}" marker-end="url(#scope-arrow)"></line>
          <text x="144" y="63" text-anchor="middle" fill="#303740" font-size="10">place order</text>
          <line x1="220" y1="108" x2="351" y2="108" stroke="#4f5965" stroke-width="1.4" marker-end="url(#scope-arrow)"></line>
          <text x="286" y="101" text-anchor="middle" fill="#303740" font-size="10">reserve items</text>
          <line x1="351" y1="142" x2="220" y2="142" stroke="#68717c" stroke-dasharray="5 3" marker-end="url(#scope-arrow)"></line>
          <text x="286" y="135" text-anchor="middle" fill="#303740" font-size="10">reserved</text>
        </svg>`;

      let miniDiagramId = 0;

      const miniDiagram = (label, body, background = "#ffffff") => {
        const markerId = `mini-arrow-${++miniDiagramId}`;
        return `
          <div style="height:278px;box-sizing:border-box;padding:12px;background:#f7f8fa;color:#20252b;font:12px/1.35 Inter,ui-sans-serif,system-ui,sans-serif">
            <div style="height:100%;box-sizing:border-box;overflow:hidden;border:1px solid #d9dde3;border-radius:12px;background:${background};box-shadow:0 8px 22px rgba(24,32,44,.06)">
              <div style="height:30px;box-sizing:border-box;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #e7e9ed;color:#737b85;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Rendered behavior</div>
              <svg viewBox="0 0 430 220" width="100%" height="220" role="img" aria-label="${label}" style="display:block">
                <defs>
                  <marker id="${markerId}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5965"></path>
                  </marker>
                </defs>
                ${body.replaceAll("__ARROW__", markerId)}
              </svg>
            </div>
          </div>`;
      };

      const participant = (x, label, options = {}) => {
        const top = options.top ?? 12;
        const bottom = options.bottom ?? 212;
        const width = options.width ?? 82;
        const fill = options.fill ?? "#f5f7f9";
        const stroke = options.stroke ?? "#c9cfd6";
        return `
          <rect x="${x - width / 2}" y="${top}" width="${width}" height="28" rx="7" fill="${fill}" stroke="${stroke}"></rect>
          <text x="${x}" y="${top + 18}" text-anchor="middle" fill="#29313a" font-size="11" font-weight="600">${label}</text>
          <line x1="${x}" y1="${top + 28}" x2="${x}" y2="${bottom}" stroke="#c7cdd4" stroke-width="1.2" stroke-dasharray="4 4"></line>`;
      };

      const message = (x1, x2, y, label, options = {}) => {
        const direction = x2 >= x1 ? 1 : -1;
        const start = x1 + direction * (options.startPad ?? 6);
        const end = x2 - direction * (options.endPad ?? 7);
        const color = options.color ?? "#4f5965";
        const dash = options.dashed ? "5 3" : "";
        const marker = options.noArrow ? "" : `marker-end="url(#__ARROW__)"`;
        return `
          <line x1="${start}" y1="${y}" x2="${end}" y2="${y}" stroke="${color}" stroke-width="${options.width ?? 1.5}" ${dash ? `stroke-dasharray="${dash}"` : ""} ${marker}></line>
          <text x="${(x1 + x2) / 2}" y="${y - 7}" text-anchor="middle" fill="#343c45" font-size="10">${label}</text>`;
      };

      const featurePreviews = {
        coreFragments: miniDiagram(
          "Alternative and loop fragments enclose message rows",
          `${participant(60, "User")}${participant(215, "API")}${participant(370, "Warehouse")}
          <rect x="28" y="51" width="374" height="87" fill="#f9fbff" stroke="#7b8da7" rx="4"></rect>
          <path d="M28 51 H115 L105 69 H28 Z" fill="#e8eef8" stroke="#7b8da7"></path>
          <text x="38" y="64" fill="#34475f" font-size="10" font-weight="700">alt</text>
          <text x="120" y="64" fill="#607086" font-size="9">In stock</text>
          ${message(215, 370, 86, "reserve")}
          <line x1="28" y1="101" x2="402" y2="101" stroke="#9aa7b7" stroke-dasharray="4 3"></line>
          <text x="38" y="114" fill="#607086" font-size="9">else · Sold out</text>
          ${message(215, 60, 128, "unavailable", { dashed: true })}
          <rect x="28" y="151" width="374" height="55" fill="#fbfcfe" stroke="#7b8da7" rx="4"></rect>
          <path d="M28 151 H130 L120 169 H28 Z" fill="#e8eef8" stroke="#7b8da7"></path>
          <text x="38" y="164" fill="#34475f" font-size="10" font-weight="700">loop</text>
          <text x="138" y="164" fill="#607086" font-size="9">Each item</text>
          ${message(215, 370, 192, "pack item")}`
        ),
        parallel: miniDiagram(
          "Parallel branches show concurrent messages",
          `${participant(60, "API")}${participant(215, "Warehouse")}${participant(370, "Payments")}
          <rect x="28" y="51" width="374" height="153" fill="#fffdf8" stroke="#98835e" rx="4"></rect>
          <path d="M28 51 H164 L154 70 H28 Z" fill="#f6ecd7" stroke="#98835e"></path>
          <text x="38" y="65" fill="#65502c" font-size="10" font-weight="700">par</text>
          <text x="74" y="65" fill="#786848" font-size="9">Reserve inventory</text>
          ${message(60, 215, 94, "reserve")}
          <line x1="28" y1="123" x2="402" y2="123" stroke="#aa9a7c" stroke-dasharray="4 3"></line>
          <text x="38" y="138" fill="#786848" font-size="9">and · Charge payment</text>
          ${message(60, 370, 174, "charge")}`
        ),
        activation: miniDiagram(
          "An activation bar spans the time API is processing",
          `${participant(62, "Client")}${participant(215, "API")}${participant(368, "Database")}
          <rect x="210" y="69" width="10" height="118" fill="#dce7f8" stroke="#627b9e"></rect>
          ${message(62, 215, 70, "place order")}
          ${message(215, 368, 106, "save order")}
          ${message(368, 215, 142, "saved", { dashed: true })}
          ${message(215, 62, 181, "confirmed", { dashed: true })}`
        ),
        notes: miniDiagram(
          "Notes attach plain-language context to participants",
          `${participant(92, "API")}${participant(338, "Database")}
          <path d="M134 52 H300 L316 68 V112 H134 Z" fill="#fff8cf" stroke="#b9a45b"></path>
          <path d="M300 52 V68 H316" fill="none" stroke="#b9a45b"></path>
          <text x="225" y="76" text-anchor="middle" fill="#544b2d" font-size="11" font-weight="600">One transaction</text>
          <text x="225" y="94" text-anchor="middle" fill="#716641" font-size="9">Diagram content, not a review comment</text>
          ${message(92, 338, 140, "save order")}
          <path d="M278 160 H402 L414 172 V207 H278 Z" fill="#fff8cf" stroke="#b9a45b"></path>
          <path d="M402 160 V172 H414" fill="none" stroke="#b9a45b"></path>
          <text x="346" y="181" text-anchor="middle" fill="#544b2d" font-size="9">Retries twice</text>
          <text x="346" y="195" text-anchor="middle" fill="#544b2d" font-size="9">before failing</text>`
        ),
        title: miniDiagram(
          "The diagram title is rendered above its participants",
          `<text x="215" y="27" text-anchor="middle" fill="#222b35" font-size="16" font-weight="700">Checkout — happy path</text>
          <line x1="112" y1="38" x2="318" y2="38" stroke="#dfe3e8"></line>
          ${participant(92, "Customer", { top: 54 })}${participant(338, "API", { top: 54 })}
          ${message(92, 338, 118, "place order")}
          ${message(338, 92, 163, "confirmed", { dashed: true })}`
        ),
        numbering: miniDiagram(
          "Every message receives an incrementing sequence number",
          `${participant(62, "Customer")}${participant(215, "API")}${participant(368, "Payments")}
          ${message(62, 215, 76, "1  place order")}
          ${message(215, 368, 121, "2  charge")}
          ${message(368, 215, 166, "3  accepted", { dashed: true })}`
        ),
        dividers: miniDiagram(
          "Named dividers and delays become timeline rows",
          `${participant(52, "Customer", { width: 76 })}${participant(215, "API", { width: 70 })}${participant(378, "Payments", { width: 76 })}
          <line x1="22" y1="62" x2="408" y2="62" stroke="#8f99a5"></line>
          <rect x="165" y="52" width="100" height="20" rx="10" fill="#eef1f4"></rect>
          <text x="215" y="65" text-anchor="middle" fill="#4b5561" font-size="9" font-weight="700">Authorization</text>
          ${message(52, 215, 94, "place order")}
          ${message(215, 378, 122, "authorize")}
          <text x="215" y="151" text-anchor="middle" fill="#7b8490" font-size="10">⋯ up to 30 seconds later ⋯</text>
          <line x1="22" y1="172" x2="408" y2="172" stroke="#8f99a5"></line>
          <rect x="173" y="162" width="84" height="20" rx="10" fill="#eef1f4"></rect>
          <text x="215" y="175" text-anchor="middle" fill="#4b5561" font-size="9" font-weight="700">Fulfilment</text>
          ${message(215, 52, 204, "accepted", { dashed: true })}`
        ),
        reference: miniDiagram(
          "A reference block stands in for another interaction",
          `${participant(86, "Customer")}${participant(344, "API")}
          <rect x="54" y="61" width="322" height="77" fill="#f8f5ff" stroke="#8675a2" rx="4"></rect>
          <path d="M54 61 H102 L92 80 H54 Z" fill="#e9e1f5" stroke="#8675a2"></path>
          <text x="65" y="75" fill="#58466f" font-size="10" font-weight="700">ref</text>
          <text x="215" y="105" text-anchor="middle" fill="#4d405f" font-size="12" font-weight="600">OAuth login</text>
          ${message(86, 344, 179, "place order")}`
        ),
        lifecycle: miniDiagram(
          "Worker appears when created and ends at a destruction mark",
          `${participant(86, "API")}
          <line x1="92" y1="75" x2="337" y2="75" stroke="#4f5965" stroke-width="1.5" marker-end="url(#__ARROW__)"></line>
          <text x="210" y="67" text-anchor="middle" fill="#343c45" font-size="10">create Worker · start job</text>
          <rect x="299" y="62" width="76" height="28" rx="7" fill="#eef6ee" stroke="#79a079"></rect>
          <text x="337" y="80" text-anchor="middle" fill="#2f5133" font-size="11" font-weight="600">Worker</text>
          <line x1="337" y1="90" x2="337" y2="184" stroke="#9eb3a1" stroke-dasharray="4 4"></line>
          ${message(337, 86, 132, "complete", { dashed: true })}
          <line x1="330" y1="178" x2="344" y2="192" stroke="#a43c3c" stroke-width="2"></line>
          <line x1="344" y1="178" x2="330" y2="192" stroke="#a43c3c" stroke-width="2"></line>
          <text x="337" y="209" text-anchor="middle" fill="#8a4b4b" font-size="9">destroyed</text>`
        ),
        shapes: miniDiagram(
          "Different participant roles use distinct header shapes",
          `<circle cx="42" cy="24" r="8" fill="none" stroke="#4f5965" stroke-width="1.5"></circle>
          <line x1="42" y1="32" x2="42" y2="51" stroke="#4f5965" stroke-width="1.5"></line>
          <line x1="29" y1="39" x2="55" y2="39" stroke="#4f5965" stroke-width="1.5"></line>
          <line x1="42" y1="51" x2="32" y2="63" stroke="#4f5965" stroke-width="1.5"></line>
          <line x1="42" y1="51" x2="52" y2="63" stroke="#4f5965" stroke-width="1.5"></line>
          <text x="42" y="78" text-anchor="middle" fill="#303740" font-size="9" font-weight="600">Customer</text>
          <line x1="42" y1="84" x2="42" y2="212" stroke="#c7cdd4" stroke-dasharray="4 4"></line>
          <rect x="107" y="22" width="76" height="42" rx="12" fill="#f5f7f9" stroke="#8895a3"></rect>
          <circle cx="117" cy="43" r="7" fill="#fff" stroke="#697786"></circle>
          <text x="148" y="47" text-anchor="middle" fill="#303740" font-size="9" font-weight="600">API</text>
          <line x1="145" y1="64" x2="145" y2="212" stroke="#c7cdd4" stroke-dasharray="4 4"></line>
          <rect x="221" y="28" width="76" height="34" fill="#f5f7f9" stroke="#8895a3"></rect>
          <ellipse cx="259" cy="28" rx="38" ry="9" fill="#f5f7f9" stroke="#8895a3"></ellipse>
          <ellipse cx="259" cy="62" rx="38" ry="9" fill="#f5f7f9" stroke="#8895a3"></ellipse>
          <text x="259" y="48" text-anchor="middle" fill="#303740" font-size="9" font-weight="600">Orders</text>
          <line x1="259" y1="71" x2="259" y2="212" stroke="#c7cdd4" stroke-dasharray="4 4"></line>
          <rect x="333" y="24" width="70" height="42" rx="5" fill="#f5f7f9" stroke="#8895a3"></rect>
          <line x1="340" y1="33" x2="396" y2="33" stroke="#a1aab4"></line>
          <line x1="340" y1="39" x2="396" y2="39" stroke="#a1aab4"></line>
          <text x="368" y="56" text-anchor="middle" fill="#303740" font-size="9" font-weight="600">Events</text>
          <line x1="368" y1="66" x2="368" y2="212" stroke="#c7cdd4" stroke-dasharray="4 4"></line>
          ${message(42, 145, 112, "place order")}${message(145, 259, 153, "save")}${message(145, 368, 194, "publish")}`
        ),
        boundaryMessages: miniDiagram(
          "Messages enter, leave, or terminate before a participant",
          `${participant(215, "API")}${participant(360, "Queue")}
          <line x1="12" y1="78" x2="208" y2="78" stroke="#4f5965" stroke-width="1.5" marker-end="url(#__ARROW__)"></line>
          <text x="111" y="69" text-anchor="middle" fill="#343c45" font-size="10">incoming webhook</text>
          <circle cx="12" cy="78" r="3" fill="#fff" stroke="#7a8490"></circle>
          <line x1="222" y1="123" x2="416" y2="123" stroke="#4f5965" stroke-width="1.5" marker-end="url(#__ARROW__)"></line>
          <text x="316" y="114" text-anchor="middle" fill="#343c45" font-size="10">publish event</text>
          <circle cx="416" cy="123" r="3" fill="#fff" stroke="#7a8490"></circle>
          <line x1="222" y1="170" x2="340" y2="170" stroke="#8f4242" stroke-width="1.5"></line>
          <text x="280" y="161" text-anchor="middle" fill="#663737" font-size="10">delivery failed</text>
          <line x1="334" y1="164" x2="346" y2="176" stroke="#a13e3e" stroke-width="2"></line>
          <line x1="346" y1="164" x2="334" y2="176" stroke="#a13e3e" stroke-width="2"></line>`
        ),
        styling: miniDiagram(
          "Source directives color participants and individual arrows",
          `${participant(92, "API", { fill: "#c9e3f6", stroke: "#5e93bb" })}${participant(338, "Database")}
          <line x1="98" y1="98" x2="331" y2="98" stroke="#d33b3b" stroke-width="2"></line>
          <polygon points="331,98 321,93 321,103" fill="#d33b3b"></polygon>
          <text x="215" y="87" text-anchor="middle" fill="#b33232" font-size="11" font-weight="600">urgent write</text>
          <rect x="123" y="139" width="184" height="35" rx="8" fill="#fff5f5" stroke="#e7b5b5"></rect>
          <text x="215" y="154" text-anchor="middle" fill="#854949" font-size="9">color and alignment now live</text>
          <text x="215" y="167" text-anchor="middle" fill="#854949" font-size="9">inside the diagram source</text>`
        ),
        preprocessing: miniDiagram(
          "Includes and macros expand into an otherwise ordinary diagram",
          `<rect x="17" y="34" width="125" height="48" rx="7" fill="#f3f0fa" stroke="#9a89b8"></rect>
          <text x="79" y="54" text-anchor="middle" fill="#5b4b73" font-size="9" font-weight="700">shared-participants.iuml</text>
          <text x="79" y="69" text-anchor="middle" fill="#76688b" font-size="8">Customer · API</text>
          <rect x="17" y="101" width="125" height="48" rx="7" fill="#eef5fb" stroke="#7f9fbb"></rect>
          <text x="79" y="121" text-anchor="middle" fill="#46637c" font-size="9" font-weight="700">CALL(...)</text>
          <text x="79" y="136" text-anchor="middle" fill="#637d93" font-size="8">generates a message</text>
          <line x1="143" y1="58" x2="178" y2="92" stroke="#9ba4ad" marker-end="url(#__ARROW__)"></line>
          <line x1="143" y1="125" x2="178" y2="100" stroke="#9ba4ad" marker-end="url(#__ARROW__)"></line>
          <rect x="176" y="21" width="238" height="183" rx="10" fill="#fff" stroke="#d2d7dd"></rect>
          <rect x="198" y="40" width="78" height="26" rx="6" fill="#f5f7f9" stroke="#c9cfd6"></rect>
          <rect x="318" y="40" width="74" height="26" rx="6" fill="#f5f7f9" stroke="#c9cfd6"></rect>
          <text x="237" y="57" text-anchor="middle" fill="#303740" font-size="9" font-weight="600">Customer</text>
          <text x="355" y="57" text-anchor="middle" fill="#303740" font-size="9" font-weight="600">API</text>
          <line x1="237" y1="66" x2="237" y2="190" stroke="#c7cdd4" stroke-dasharray="4 4"></line>
          <line x1="355" y1="66" x2="355" y2="190" stroke="#c7cdd4" stroke-dasharray="4 4"></line>
          ${message(237, 355, 104, "place order")}
          <path d="M270 130 H389 L400 141 V178 H270 Z" fill="#fff8cf" stroke="#b9a45b"></path>
          <path d="M389 130 V141 H400" fill="none" stroke="#b9a45b"></path>
          <text x="335" y="153" text-anchor="middle" fill="#544b2d" font-size="10" font-weight="700">Important</text>
          <text x="335" y="168" text-anchor="middle" fill="#716641" font-size="8">rich markup</text>`
        ),
        pagination: miniDiagram(
          "Manual spacing creates a large gap and newpage creates separate outputs",
          `<rect x="18" y="18" width="188" height="188" rx="5" fill="#fff" stroke="#c8ced5"></rect>
          <rect x="224" y="18" width="188" height="188" rx="5" fill="#fff" stroke="#c8ced5"></rect>
          <text x="112" y="36" text-anchor="middle" fill="#747e89" font-size="9" font-weight="700">PAGE 1</text>
          <text x="318" y="36" text-anchor="middle" fill="#747e89" font-size="9" font-weight="700">PAGE 2 · Retry path</text>
          <rect x="36" y="48" width="60" height="22" rx="5" fill="#f5f7f9" stroke="#c9cfd6"></rect>
          <rect x="128" y="48" width="60" height="22" rx="5" fill="#f5f7f9" stroke="#c9cfd6"></rect>
          <text x="66" y="63" text-anchor="middle" fill="#303740" font-size="8">Customer</text>
          <text x="158" y="63" text-anchor="middle" fill="#303740" font-size="8">API</text>
          <line x1="66" y1="70" x2="66" y2="190" stroke="#c7cdd4" stroke-dasharray="3 3"></line>
          <line x1="158" y1="70" x2="158" y2="190" stroke="#c7cdd4" stroke-dasharray="3 3"></line>
          ${message(66, 158, 92, "first attempt")}
          <line x1="102" y1="108" x2="102" y2="164" stroke="#b57a48" stroke-width="1.5"></line>
          <line x1="97" y1="108" x2="107" y2="108" stroke="#b57a48"></line>
          <line x1="97" y1="164" x2="107" y2="164" stroke="#b57a48"></line>

## Product

A lightweight, browser-native sequence-diagram renderer and semantic WYSIWYG editor. It is not a general drawing canvas and not a full PlantUML renderer. Automatic layout is authoritative; users edit meaning, ordering, and nesting rather than pixel coordinates.

## Canonical data and syntax

- A small structured document with stable IDs is canonical for editing and host integrations.
- Import and export a documented PlantUML-compatible sequence subset. Export is semantic and normalized, not formatting-preserving.
- Accept optional \`@startuml\` / \`@enduml\`, line comments, explicit or implicit participants, aliases, quoted/Unicode labels, and multiline escapes.
- V1 message forms: synchronous call, asynchronous message, dashed reply, reverse direction, and self-message.
- V1 structural forms: \`alt/else\`, \`opt\`, \`loop\`, plain-text notes, explicit activation/deactivation, and a plain title.
- Unknown or unsupported statements are never ignored silently. Parsing returns line/column diagnostics and blocks unsafe visual edits while preserving the original input for correction.
- Exclude preprocessing, includes, raw HTML/Creole, links/images, \`skinparam\`, colors, arbitrary style directives, manual coordinates, pagination, and pixel spacing.

## Editor and renderer

- A semantic canvas is primary; source is available in an on-demand drawer.
- Add, rename, reorder, and delete participants. Add, retarget, relabel, restyle, reorder, and delete messages. Add, nest, relabel, and resize supported fragments over timeline rows.
- Inline label editing, contextual controls, multiselect only where it has an obvious operation, undo/redo, copy/paste, keyboard navigation, and visible focus.
- Read-only and edit modes use the same renderer. Multiple independent instances work on one page.
- Responsive SVG with deterministic layout, text wrapping, horizontal overflow, fit/reset zoom, no clipping, and SVG export.
- Accessible ordered-text alternative and structured outline; every edit is possible without a pointer. Respect reduced motion, system theme, and host font sizing.
- Treat labels as untrusted plain text. No \`innerHTML\` for diagram content, no network fetches, and explicit limits for source size, participants, nesting, and messages.

## Integration boundary

- The library exposes stable IDs, selected element data, geometry, focus/select methods, and input/change/selection/diagnostic events.
- Hosts own comments, authorship, persistence, resolution state, and review export. The library contains no Interview Harness-specific behavior.
- Theme with documented CSS custom properties and parts; default styling is complete without host CSS.

## Distribution

- Publish one ESM-only npm package for current evergreen browsers. CommonJS, UMD, framework wrappers, and SSR are not v1 requirements.
- The package root is side-effect-free and exposes typed parser/model/renderer/editor APIs. \`./element.js\` is an opt-in side-effectful entry that registers \`<lines-and-arrows>\`.
- Ship generated \`.d.ts\`, source maps, license, README, changelog, and only intended \`dist\` files. Use explicit \`exports\`, \`types\`, \`files\`, and accurate \`sideEffects\` metadata.
- Provide one self-contained, versioned browser file so an exact jsDelivr npm URL works without a build step. Document exact-version URLs for production; do not recommend \`latest\`.
- Before every release, test the packed tarball in vanilla HTML and a representative bundler, type-check a consumer fixture, verify multiple elements and cleanup, enforce a compressed size budget, and smoke-test the exact published CDN URL.

## Explicitly later

Candidate additions include parallel fragments, numbering, dividers/delays, references, create/destroy, participant shape variants, external/lost messages, PNG export, framework wrappers, and richer annotation adapters. Add them only from demonstrated use, not PlantUML feature parity.`
