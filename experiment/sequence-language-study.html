  &lt;style&gt;
    #control-topology-study {

      text-align: center;

    #control-topology-study .anatomy-legend {

    #control-topology-study .legend-item {

      border: 0;

    #control-topology-study .legend-mark.group {

    #control-topology-study .evidence-flow {

    #control-topology-study pre.source,

    #control-topology-study pre.model {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted-foreground);
      border-left: 2px solid var(--border);
      padding: 0.75rem 0 0.75rem 0.9rem;
      margin: 0.75rem 0 0;
      background: transparent;
    }

    #control-topology-study pre.syntax {
      color: var(--foreground);
      border-left-color: var(--viz-series-1);

    #control-topology-study .merge-result {

    #control-topology-study .coverage-bar {

  &lt;/style&gt;

  &lt;header class=&quot;report-header&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Corrected product frame&lt;/p&gt;
    &lt;h2&gt;Four controls, many selectable flavors&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;The experiment should decide which editing operations deserve first-class controls. It should not mistake values inside those controls—group labels, icons, or arrowheads—for separate product capabilities.&lt;/p&gt;
    &lt;p class=&quot;decision-rule&quot;&gt;&lt;strong&gt;Primitive test:&lt;/strong&gt; if two constructs are selected, moved, edited, nested, and deleted in the same way, they are one control with a property selector—not two features.&lt;/p&gt;

    &lt;div class=&quot;viz-grid metric-grid&quot;&gt;
      &lt;section class=&quot;card viz-stat&quot;&gt;
        &lt;p class=&quot;text-muted&quot;&gt;Core canvas controls&lt;/p&gt;

        &lt;p class=&quot;metric-context&quot;&gt;actor · connection · group&lt;/p&gt;
      &lt;/section&gt;
      &lt;section class=&quot;card viz-stat&quot;&gt;

        &lt;p class=&quot;metric-context&quot;&gt;pill on an actor or connection&lt;/p&gt;
      &lt;/section&gt;
      &lt;section class=&quot;card viz-stat&quot;&gt;
        &lt;p class=&quot;text-muted&quot;&gt;Group usage&lt;/p&gt;
        &lt;p class=&quot;viz-stat-value&quot;&gt;86%&lt;/p&gt;
        &lt;p class=&quot;metric-context&quot;&gt;one generic group control covers it&lt;/p&gt;
      &lt;/section&gt;

  &lt;/header&gt;

  &lt;section class=&quot;report-section&quot; aria-labelledby=&quot;anatomy-heading&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Control anatomy&lt;/p&gt;
    &lt;h2 id=&quot;anatomy-heading&quot;&gt;The editor sees objects and attachments&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;This single interaction contains every core control. “Critical” is not a fifth primitive: it is the selected type of the group and the visible label of a pill.&lt;/p&gt;

    &lt;div class=&quot;sequence-stage&quot; role=&quot;group&quot; aria-label=&quot;Sequence editor anatomy with three icon-bearing actors, a generic critical group, one arrow connection, a comment pill on API, and a critical pill on the connection.&quot;&gt;
      &lt;div class=&quot;actors&quot;&gt;
        &lt;div class=&quot;actor-control&quot;&gt;
          &lt;span class=&quot;actor-icon&quot;&gt;&lt;i data-lucide=&quot;server&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;

          &lt;span class=&quot;pill-row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-tooltip=&quot;any text&quot;&gt;comment&lt;/button&gt;&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;actor-control&quot;&gt;
          &lt;span class=&quot;actor-icon&quot;&gt;&lt;i data-lucide=&quot;cpu&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;

        &lt;div class=&quot;actor-control&quot;&gt;

      &lt;/div&gt;

      &lt;div class=&quot;stage-body&quot;&gt;
        &lt;div class=&quot;lifelines&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;span class=&quot;lifeline&quot;&gt;&lt;/span&gt;&lt;span class=&quot;lifeline&quot;&gt;&lt;/span&gt;&lt;span class=&quot;lifeline&quot;&gt;&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;group-control&quot;&gt;
          &lt;div class=&quot;group-header&quot;&gt;
            &lt;span class=&quot;viz-badge&quot;&gt;group&lt;/span&gt;
            &lt;span class=&quot;group-label&quot;&gt;type:&lt;/span&gt;
            &lt;strong&gt;critical&lt;/strong&gt;

          &lt;/div&gt;

            &lt;span class=&quot;message-endpoint&quot;&gt;Worker&lt;/span&gt;
            &lt;span class=&quot;message-label&quot;&gt;start job&lt;/span&gt;
            &lt;span class=&quot;message-pill&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-tooltip=&quot;something else&quot;&gt;critical&lt;/button&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;message-control&quot;&gt;
            &lt;span class=&quot;message-endpoint&quot;&gt;Worker&lt;/span&gt;
            &lt;span class=&quot;message-line&quot;&gt;&lt;span class=&quot;message-shaft&quot;&gt;&lt;/span&gt;&lt;span class=&quot;message-head&quot;&gt;&lt;/span&gt;&lt;/span&gt;
            &lt;span class=&quot;message-endpoint&quot;&gt;Jobs&lt;/span&gt;

    &lt;div class=&quot;anatomy-legend&quot; aria-label=&quot;Control legend&quot;&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;legend-mark actor&quot;&gt;&lt;/span&gt;actor control&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;legend-mark connection&quot;&gt;&lt;/span&gt;connection control&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;legend-mark group&quot;&gt;&lt;/span&gt;group control&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;legend-mark pill&quot;&gt;&lt;/span&gt;pill attachment&lt;/span&gt;

  &lt;section class=&quot;report-section&quot; aria-labelledby=&quot;controls-heading&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Actual MVP surface&lt;/p&gt;
    &lt;h2 id=&quot;controls-heading&quot;&gt;Build these controls once&lt;/h2&gt;

    &lt;div class=&quot;control-grid&quot;&gt;
      &lt;article class=&quot;control-item&quot;&gt;
        &lt;p class=&quot;control-number&quot;&gt;01 · canvas object&lt;/p&gt;
        &lt;h3&gt;Actor&lt;/h3&gt;
        &lt;p&gt;One uniform actor control. Meaning comes from a readable label and an icon slot, not a hardcoded UML taxonomy.&lt;/p&gt;
        &lt;dl class=&quot;property-list&quot;&gt;
          &lt;dt&gt;Identity&lt;/dt&gt;&lt;dd&gt;Stable ID and display label.&lt;/dd&gt;
          &lt;dt&gt;Icon&lt;/dt&gt;&lt;dd&gt;Qualified, version-stable icon ID such as &lt;code&gt;collection:name&lt;/code&gt;.&lt;/dd&gt;
          &lt;dt&gt;Order&lt;/dt&gt;&lt;dd&gt;Horizontal position among actors.&lt;/dd&gt;
          &lt;dt&gt;Attachments&lt;/dt&gt;&lt;dd&gt;Zero or more pills.&lt;/dd&gt;
        &lt;/dl&gt;
      &lt;/article&gt;

      &lt;article class=&quot;control-item&quot;&gt;
        &lt;p class=&quot;control-number&quot;&gt;02 · timeline object&lt;/p&gt;
        &lt;h3&gt;Connection&lt;/h3&gt;
        &lt;p&gt;One arrow control with endpoints and text. Solid, dashed, open, synchronous, asynchronous, and future arrowheads are flavor choices added during visual polish.&lt;/p&gt;
        &lt;dl class=&quot;property-list&quot;&gt;
          &lt;dt&gt;Endpoints&lt;/dt&gt;&lt;dd&gt;Source and target actor; equality creates a self-connection.&lt;/dd&gt;
          &lt;dt&gt;Label&lt;/dt&gt;&lt;dd&gt;Human-readable interaction text.&lt;/dd&gt;
          &lt;dt&gt;Arrow&lt;/dt&gt;&lt;dd&gt;A visual/semantic style value, not a new primitive.&lt;/dd&gt;
          &lt;dt&gt;Attachments&lt;/dt&gt;&lt;dd&gt;Zero or more pills.&lt;/dd&gt;
        &lt;/dl&gt;
      &lt;/article&gt;

      &lt;article class=&quot;control-item&quot;&gt;
        &lt;p class=&quot;control-number&quot;&gt;03 · structural object&lt;/p&gt;
        &lt;h3&gt;Group&lt;/h3&gt;
        &lt;p&gt;One nestable container with a type selector. &lt;code&gt;loop&lt;/code&gt;, &lt;code&gt;opt&lt;/code&gt;, &lt;code&gt;critical&lt;/code&gt;, &lt;code&gt;par&lt;/code&gt;, &lt;code&gt;alt&lt;/code&gt;, &lt;code&gt;break&lt;/code&gt;, &lt;code&gt;ref&lt;/code&gt;, and custom labels share the same editing control.&lt;/p&gt;
        &lt;dl class=&quot;property-list&quot;&gt;
          &lt;dt&gt;Type&lt;/dt&gt;&lt;dd&gt;Preset or custom value controlling header and presentation.&lt;/dd&gt;
          &lt;dt&gt;Label&lt;/dt&gt;&lt;dd&gt;Readable condition, purpose, or reference.&lt;/dd&gt;
          &lt;dt&gt;Sections&lt;/dt&gt;&lt;dd&gt;One by default; add branches when needed.&lt;/dd&gt;
          &lt;dt&gt;Children&lt;/dt&gt;&lt;dd&gt;Connections and nested groups.&lt;/dd&gt;
        &lt;/dl&gt;
      &lt;/article&gt;

      &lt;article class=&quot;control-item&quot;&gt;
        &lt;p class=&quot;control-number&quot;&gt;04 · cross-cutting attachment&lt;/p&gt;
        &lt;h3&gt;Pill&lt;/h3&gt;
        &lt;p&gt;A compact visible tag whose detail appears on hover or keyboard focus. It replaces diagram notes without forcing annotation text into the sequence layout.&lt;/p&gt;
        &lt;dl class=&quot;property-list&quot;&gt;
          &lt;dt&gt;Tag&lt;/dt&gt;&lt;dd&gt;Short visible text such as &lt;code&gt;comment&lt;/code&gt; or &lt;code&gt;critical&lt;/code&gt;.&lt;/dd&gt;
          &lt;dt&gt;Detail&lt;/dt&gt;&lt;dd&gt;Tooltip text after the first colon.&lt;/dd&gt;
          &lt;dt&gt;Anchor&lt;/dt&gt;&lt;dd&gt;Actor or connection in MVP; model can remain extensible.&lt;/dd&gt;
          &lt;dt&gt;Multiplicity&lt;/dt&gt;&lt;dd&gt;Multiple pills preserve source order.&lt;/dd&gt;
        &lt;/dl&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;report-section&quot; aria-labelledby=&quot;group-heading&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Reinterpreting PlantUML&lt;/p&gt;

    &lt;div class=&quot;merge-result&quot;&gt;
      &lt;p&gt;&lt;span class=&quot;viz-badge&quot;&gt;one model&lt;/span&gt;&lt;/p&gt;
      &lt;pre class=&quot;model&quot;&gt;&lt;code&gt;Group {
  type: string
  label: string
  sections: Section[]
}

Section {
  label?: string
  rows: (Connection | Group)[]
}&lt;/code&gt;&lt;/pre&gt;
      &lt;p class=&quot;text-muted&quot;&gt;No separate &lt;code&gt;Alt&lt;/code&gt;, &lt;code&gt;Loop&lt;/code&gt;, &lt;code&gt;Critical&lt;/code&gt;, or &lt;code&gt;Parallel&lt;/code&gt; AST nodes. A branching group has several sections; a simple group has one.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;report-section&quot; aria-labelledby=&quot;evidence-heading&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Corpus remapped by control family&lt;/p&gt;
    &lt;h2 id=&quot;evidence-heading&quot;&gt;Frequency informs defaults, not architecture&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;The 100-diagram corpus remains useful after changing the unit of analysis. It validates the three canvas controls, shows that groups need optional sections, and identifies two genuinely different controls that can wait.&lt;/p&gt;

    &lt;div role=&quot;img&quot; aria-label=&quot;Usage by control family across one hundred diagrams. Actors and connections appear in all one hundred diagrams, groups in eighty-six, multi-section groups in seventy-six, lifeline spans in five, and timeline markers in three.&quot;&gt;
      &lt;div class=&quot;coverage-bar&quot;&gt;&lt;span&gt;Actors&lt;/span&gt;&lt;span class=&quot;bar-track&quot;&gt;&lt;span class=&quot;bar-fill&quot; style=&quot;--bar-width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bar-value&quot;&gt;100&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;coverage-bar&quot;&gt;&lt;span&gt;Connections&lt;/span&gt;&lt;span class=&quot;bar-track&quot;&gt;&lt;span class=&quot;bar-fill&quot; style=&quot;--bar-width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bar-value&quot;&gt;100&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;coverage-bar&quot;&gt;&lt;span&gt;Any group&lt;/span&gt;&lt;span class=&quot;bar-track&quot;&gt;&lt;span class=&quot;bar-fill secondary&quot; style=&quot;--bar-width:86%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bar-value&quot;&gt;86&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;coverage-bar&quot;&gt;&lt;span&gt;Multi-section group&lt;/span&gt;&lt;span class=&quot;bar-track&quot;&gt;&lt;span class=&quot;bar-fill secondary&quot; style=&quot;--bar-width:76%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bar-value&quot;&gt;76&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;coverage-bar&quot;&gt;&lt;span&gt;Lifeline span/state&lt;/span&gt;&lt;span class=&quot;bar-track&quot;&gt;&lt;span class=&quot;bar-fill rare&quot; style=&quot;--bar-width:5%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bar-value&quot;&gt;5&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;coverage-bar&quot;&gt;&lt;span&gt;Timeline marker/gap&lt;/span&gt;&lt;span class=&quot;bar-track&quot;&gt;&lt;span class=&quot;bar-fill rare&quot; style=&quot;--bar-width:3%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bar-value&quot;&gt;3&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;two-column&quot;&gt;
      &lt;article class=&quot;evidence-item&quot;&gt;
        &lt;h3&gt;What the study does tell us&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Actors and connections are unavoidable.&lt;/li&gt;
          &lt;li&gt;A generic group is central: 86 diagrams used at least one grouping across all ten domains.&lt;/li&gt;
          &lt;li&gt;Sections are part of the group control: 76 diagrams needed alternative or parallel branches.&lt;/li&gt;
          &lt;li&gt;Observed frequencies can order presets in menus and choose defaults.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;
      &lt;article class=&quot;evidence-item&quot;&gt;
        &lt;h3&gt;What it cannot decide&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Whether &lt;code&gt;loop&lt;/code&gt; deserves support but &lt;code&gt;critical&lt;/code&gt; does not; both are group values.&lt;/li&gt;
          &lt;li&gt;How many icons or arrowheads eventually belong in their selectors.&lt;/li&gt;
          &lt;li&gt;Whether pills matter: the prompt suppressed optional clutter and PlantUML lacks this compact attached primitive.&lt;/li&gt;
          &lt;li&gt;The direct Interview Harness need is sufficient product evidence for pills, without making the library IH-specific.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;report-section&quot; aria-labelledby=&quot;pill-heading&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;New syntax primitive&lt;/p&gt;
    &lt;h2 id=&quot;pill-heading&quot;&gt;Pills are attached metadata, not free-floating notes&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;The visible tag stays compact; the detail is available as a tooltip. The library treats tags as arbitrary text and exposes stable pill IDs and events, allowing embedding products to attach their own workflows.&lt;/p&gt;

    &lt;div class=&quot;two-column&quot;&gt;
      &lt;section&gt;
        &lt;h3&gt;Source sketch&lt;/h3&gt;
        &lt;pre class=&quot;syntax&quot;&gt;&lt;code&gt;actor API ((comment: any text))
actor Worker

API -&amp;gt; Worker: start job ((critical: something else))
Worker --&amp;gt; API: completed&lt;/code&gt;&lt;/pre&gt;
      &lt;/section&gt;
      &lt;section&gt;
        &lt;h3&gt;Parsing rule&lt;/h3&gt;
        &lt;pre class=&quot;model&quot;&gt;&lt;code&gt;pill       := &quot;((&quot; tag &quot;:&quot; detail &quot;))&quot;
actor      := actor-declaration pill*
connection := arrow-expression pill*

Pill {
  id: string
  tag: string
  detail: string
}&lt;/code&gt;&lt;/pre&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;ul class=&quot;boundary-list&quot;&gt;
      &lt;li&gt;The first colon separates the visible tag from tooltip detail; later colons remain part of the detail.&lt;/li&gt;
      &lt;li&gt;Pills are selectable, keyboard reachable, editable, reorderable, and removable through one shared inspector.&lt;/li&gt;
      &lt;li&gt;A &lt;code&gt;comment&lt;/code&gt; pill is ordinary document data. The host may associate it with a review thread, but the core package does not know about interviews or comments.&lt;/li&gt;
      &lt;li&gt;Free-floating PlantUML notes remain unnecessary for MVP because pills cover compact attachment and the host covers long-form discussion.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

  &lt;section class=&quot;report-section&quot; aria-labelledby=&quot;model-heading&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Canonical document model&lt;/p&gt;
    &lt;h2 id=&quot;model-heading&quot;&gt;Keep the schema open where the UI is a selector&lt;/h2&gt;

    &lt;div class=&quot;two-column&quot;&gt;
      &lt;section&gt;
        &lt;h3&gt;Core AST&lt;/h3&gt;
        &lt;pre class=&quot;model&quot;&gt;&lt;code&gt;Document {
  actors: Actor[]
  rows: (Connection | Group)[]
}

Actor {
  id: string
  label: string
  icon?: QualifiedIconId
  pills: Pill[]
}

Connection {
  id: string
  from: ActorId
  to: ActorId
  label: string
  arrow: ArrowStyle
  pills: Pill[]
}

Group {
  id: string
  type: string
  label: string
  sections: Section[]
}&lt;/code&gt;&lt;/pre&gt;
      &lt;/section&gt;
      &lt;section&gt;
        &lt;h3&gt;Late-bound catalogs&lt;/h3&gt;
        &lt;dl class=&quot;property-list&quot;&gt;
          &lt;dt&gt;Icons&lt;/dt&gt;&lt;dd&gt;The document stores a qualified stable ID. The renderer receives an icon resolver; the editor can lazy-load a searchable catalog separately from core.&lt;/dd&gt;
          &lt;dt&gt;Arrows&lt;/dt&gt;&lt;dd&gt;The schema stores an arrow style. Exact tokens, heads, line patterns, and selector order are finalized after the base editor works.&lt;/dd&gt;
          &lt;dt&gt;Groups&lt;/dt&gt;&lt;dd&gt;The model accepts a string type. The editor offers friendly presets plus a custom value, so new labels do not require schema changes.&lt;/dd&gt;
          &lt;dt&gt;Pills&lt;/dt&gt;&lt;dd&gt;Tags are open text. Hosts may layer meaning on recognized tags without changing portable diagram data.&lt;/dd&gt;
        &lt;/dl&gt;
      &lt;/section&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;report-section&quot; aria-labelledby=&quot;boundary-heading&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;The real MVP boundary&lt;/p&gt;
    &lt;h2 id=&quot;boundary-heading&quot;&gt;Defer different controls, not cheap selector values&lt;/h2&gt;

    &lt;div class=&quot;two-column&quot;&gt;
      &lt;article class=&quot;evidence-item&quot;&gt;
        &lt;h3&gt;Include now&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Actor add, remove, rename, reorder, icon selection, and pill attachment.&lt;/li&gt;
          &lt;li&gt;Connection add, retarget, relabel, reorder, self-target, arrow selection, and pill attachment.&lt;/li&gt;
          &lt;li&gt;Generic group create, type, label, section add/remove, nest, move, resize/reparent, and delete.&lt;/li&gt;
          &lt;li&gt;Bidirectional canonical text editing with stable IDs, diagnostics, undo, and redo.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;
      &lt;article class=&quot;evidence-item&quot;&gt;
        &lt;h3&gt;Defer as genuinely different controls&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;Timeline marker:&lt;/strong&gt; a gap, phase divider, or elapsed-time row. Three corpus diagrams used one.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Lifeline span/state:&lt;/strong&gt; activation or creation/destruction intervals tied to row ranges. Five diagrams used one.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Cross-diagram navigation:&lt;/strong&gt; references with actual link behavior belong to the host contract.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Free placement:&lt;/strong&gt; arbitrary coordinates, floating notes, and decorative shapes would create a different editor.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;report-section&quot; aria-labelledby=&quot;plan-heading&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Revised implementation order&lt;/p&gt;
    &lt;h2 id=&quot;plan-heading&quot;&gt;Build by interaction topology&lt;/h2&gt;

    &lt;div class=&quot;implementation-grid&quot;&gt;
      &lt;article class=&quot;implementation-step&quot;&gt;
        &lt;p class=&quot;step-number&quot;&gt;01&lt;/p&gt;
        &lt;h3&gt;Model the four controls&lt;/h3&gt;
        &lt;p&gt;Freeze actor, connection, group/section, and pill schemas with stable IDs and source spans. Keep icon, arrow, group type, and pill tag values open.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;implementation-step&quot;&gt;
        &lt;p class=&quot;step-number&quot;&gt;02&lt;/p&gt;
        &lt;h3&gt;Ship one baseline rendering&lt;/h3&gt;
        &lt;p&gt;Uniform actors, one arrow, one group appearance, and pill tags. Prove layout, selection geometry, text synchronization, and nesting before growing catalogs.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;implementation-step&quot;&gt;
        &lt;p class=&quot;step-number&quot;&gt;03&lt;/p&gt;
        &lt;h3&gt;Complete WYSIWYG operations&lt;/h3&gt;
        &lt;p&gt;Add, move, reorder, retarget, wrap in group, add section, reparent, attach pill, edit, delete, copy/paste, undo/redo, and keyboard navigation.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;implementation-step&quot;&gt;
        &lt;p class=&quot;step-number&quot;&gt;04&lt;/p&gt;
        &lt;h3&gt;Add the icon resolver and picker&lt;/h3&gt;
        &lt;p&gt;Choose a version-pinned public collection, persist qualified IDs, keep the renderer resolver-based, and split the searchable catalog from the lightweight runtime.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;implementation-step&quot;&gt;
        &lt;p class=&quot;step-number&quot;&gt;05&lt;/p&gt;
        &lt;h3&gt;Polish selectors&lt;/h3&gt;
        &lt;p&gt;Add the generous group preset list, arrow styles, icon search/categories, defaults informed by the corpus, and graceful fallbacks for unknown values.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;implementation-step&quot;&gt;
        &lt;p class=&quot;step-number&quot;&gt;06&lt;/p&gt;
        &lt;h3&gt;Evaluate new control families&lt;/h3&gt;
        &lt;p&gt;Only after the core is usable, test whether timeline markers or lifeline spans solve real editing needs that cannot be represented by groups, connections, or pills.&lt;/p&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;footer class=&quot;report-section&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Bottom line&lt;/p&gt;
    &lt;h2&gt;The small product is not the one with few labels&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;It is the one with few interaction models. Actors can carry many icons, connections can carry many arrow styles, and groups can carry many type labels without making the editor conceptually larger. Pills add one compact, reusable attachment model and eliminate the need for free-floating notes.&lt;/p&gt;
    &lt;div class=&quot;source-links&quot; aria-label=&quot;Experiment evidence&quot;&gt;
      &lt;a href=&quot;protocol.md&quot;&gt;Study protocol&lt;/a&gt;

      &lt;a href=&quot;render-summary-corpus.json&quot;&gt;PlantUML render audit&lt;/a&gt;
    &lt;/div&gt;
  &lt;/footer&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
