<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lines &amp; Arrows editor</title>
    <style>
      :root {
        color-scheme: light;
        --page: #eef0f4;
        --panel: #f6f7f9;
        --text: #20242c;
        --muted: #6a7280;
        --control: #e2e5eb;
        --control-active: #20242c;
        --control-active-text: #f6f7f9;
        --input: #ffffff;
        --border: #d6dae2;
        --danger: #b4384a;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #0b0d12;
        --panel: #111319;
        --text: #e7eaf0;
        --muted: #a0a7b3;
        --control: #20242d;
        --control-active: #e7eaf0;
        --control-active-text: #111319;
        --input: #161920;
        --border: #303641;
        --danger: #ff8fa0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100dvh;
        background: var(--page);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 720;
        letter-spacing: -0.035em;
      }

      p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .segmented {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border-radius: 12px;
        background: var(--control);
      }

      button {
        min-height: 34px;
        padding: 0 13px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        background: var(--control-active);
        color: var(--control-active-text);
      }

      button:focus-visible {
        outline: 2px solid #6d8cff;
        outline-offset: 2px;
      }

      .canvas-shell {
        overflow: hidden;
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 20px 54px rgb(24 31 45 / 0.08);
      }

      lines-and-arrows {
        display: block;
        min-width: 720px;
      }

      [hidden] {
        display: none !important;
      }

      .source-editor {
        padding: 18px;
      }

      .source-editor textarea {
        display: block;
        width: 100%;
        min-height: 680px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        outline: none;
        resize: vertical;
        background: var(--input);
        color: var(--text);
        font: 500 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        tab-size: 2;
      }

      .source-editor textarea:focus {
        border-color: #6d8cff;
        box-shadow: 0 0 0 3px rgb(109 140 255 / 0.16);
      }

      .source-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }

      .apply-source {
        background: var(--control-active);
        color: var(--control-active-text);
      }

      .source-error {
        margin: 0;
        color: var(--danger);
      }

      @media (max-width: 720px) {
        main {
          width: calc(100% - 20px);
          padding-top: 18px;
        }

        header {
          align-items: start;
          flex-direction: column;
          gap: 14px;
        }

        .canvas-shell {
          overflow-x: auto;
          border-radius: 16px;
        }

        .toolbar {
          width: 100%;
          justify-content: space-between;
          flex-wrap: wrap;
        }

        .source-editor {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Lines &amp; Arrows</h1>
          <p id="mode-help">
            Edit mode. Select an object to change it, then drag to reorder.
          </p>
        </div>
        <div class="toolbar">
          <div class="segmented" aria-label="Editor mode">
            <button type="button" data-surface="view">View</button>
            <button type="button" data-surface="edit" aria-pressed="true">
              Edit
            </button>
            <button type="button" data-surface="source">Source</button>
          </div>
          <div class="segmented" aria-label="Color theme">
            <button type="button" data-theme="light">Light</button>
            <button type="button" data-theme="dark">Dark</button>
            <button type="button" data-theme="auto" aria-pressed="true">
              System
            </button>
          </div>
        </div>
      </header>

      <section class="canvas-shell" aria-label="Diagram preview">
        <lines-and-arrows
          id="diagram"
          theme="auto"
          mode="edit"
          label="Report processing sequence"
        ></lines-and-arrows>
        <div class="source-editor" id="source-editor" hidden>
          <label for="source">
            <span hidden>Diagram source</span>
          </label>
          <textarea
            id="source"
            spellcheck="false"
            aria-label="Diagram source"
          ></textarea>
          <div class="source-actions">
            <button type="button" class="apply-source" id="apply-source">
              Apply source
            </button>
            <p class="source-error" id="source-error" role="alert"></p>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { defineLinesAndArrows } from "../src/index.js";

      defineLinesAndArrows();

      const source = `@Customer
  icon user
  tag review
  tooltip Reviews the result before it is accepted

@API
  icon cloud
  tag comment
  tooltip Public entry point

@Worker
  icon gear-six

@Queue
  icon tray

Customer -> API: Submit report
  tag critical
  tooltip The report must retain its original evidence
  tooltip-icon warning

critical Process report
  API -> Worker: Start analysis
  parallel Prepare result
    | validate input
      Worker -> Worker: Check evidence
    | persist event
      Worker -> Queue: Store audit event
  gap 30 seconds later
  choice Worker result
    | completed
      Worker --> API: Analysis complete
    | queue unavailable
      Worker ->x Queue: Publish completion event

API --> Customer: Present result`;

      const diagram = document.querySelector("#diagram");
      const root = document.documentElement;
      const themeButtons = [...document.querySelectorAll("[data-theme]")];
      const surfaceButtons = [
        ...document.querySelectorAll("[data-surface]"),
      ];
      const sourceEditor = document.querySelector("#source-editor");
      const sourceInput = document.querySelector("#source");
      const sourceError = document.querySelector("#source-error");
      const applySource = document.querySelector("#apply-source");
      const modeHelp = document.querySelector("#mode-help");

      diagram.source = source;
      sourceInput.value = source;

      for (const button of themeButtons) {
        button.addEventListener("click", () => {
          const theme = button.dataset.theme;
          diagram.theme = theme;
          root.dataset.theme =
            theme === "auto"
              ? matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          for (const candidate of themeButtons) {
            candidate.setAttribute(
              "aria-pressed",
              String(candidate === button),
            );
          }
        });
      }

      const setSurface = (surface) => {
        for (const button of surfaceButtons) {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.surface === surface),
          );
        }

        if (surface === "source") {
          diagram.mode = "edit";
          diagram.hidden = true;
          sourceEditor.hidden = false;
          sourceInput.value = diagram.source;
          modeHelp.textContent =
            "Source mode. Apply with the button or Command-Enter.";
          sourceInput.focus();
          return;
        }

        sourceEditor.hidden = true;
        diagram.hidden = false;
        diagram.selectable = surface !== "view";
        diagram.mode = surface;
        modeHelp.textContent =
          surface === "edit"
            ? "Edit mode. Select an object to change it, then drag to reorder."
            : "View mode. Read-only diagram without selection controls.";
      };

      for (const button of surfaceButtons) {
        button.addEventListener("click", () =>
          setSurface(button.dataset.surface),
        );
      }

      const applySourceEdit = () => {
        sourceError.textContent = "";
        const result = diagram.replaceSource(sourceInput.value);
        if (result !== null && result !== false) {
          sourceInput.value = diagram.source;
        }
      };

      applySource.addEventListener("click", applySourceEdit);
      sourceInput.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          applySourceEdit();
        }
      });

      diagram.addEventListener("la-change", (event) => {
        sourceInput.value = event.detail.source;
        sourceError.textContent = "";
      });

      diagram.addEventListener("la-error", (event) => {
        sourceError.textContent =
          event.detail.error?.message ?? "Unable to apply source.";
      });

      const media = matchMedia("(prefers-color-scheme: dark)");
      const syncSystemTheme = () => {
        if (diagram.theme === "auto") {
          root.dataset.theme = media.matches ? "dark" : "light";
        }
      };
      media.addEventListener("change", syncSystemTheme);
      syncSystemTheme();
    </script>
  </body>
</html>
