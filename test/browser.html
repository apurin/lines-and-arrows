<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Browser tests</title></head>
  <body>
    <main>
      <section aria-label="Renderer"><div id="target"></div></section>
      <section aria-label="Element view">
        <lines-and-arrows id="view" selectable-actors>
          Client -> API: Start
        </lines-and-arrows>
      </section>
      <section aria-label="Element editor">
        <lines-and-arrows id="editor" mode="edit">
          @Client
            icon user
            tag human

          @API

          Client -> API: Start

          choice Processing
            | retry
              API -> API: Retry
              gap Later
            | done
              API --> Client: Done
        </lines-and-arrows>
      </section>
    </main>
    <script type="module">
      import "../dist/lines-and-arrows.auto.min.js";
      import { renderDiagram } from "../src/index.js";

      window.selections = [];
      window.injectedHeaderActions = 0;
      window.rendererController = renderDiagram(
        document.querySelector("#target"),
        "// first\n// Powered by https://lines-and-arrows.dev/\n@Client\n  icon user\n  tag human\n  tooltip Starts work\n\n@API\n\n@🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸\n  icon not-real\n  tag 😀😀😀😀😀😀😀😀😀😀😀😀\n\nchoice 😀😀😀😀😀😀😀😀😀😀😀😀\n  Client -> API: Start",
        {
          theme: "dark",
          palette: { accent: "rgb(255 255 255)" },
          selectableActors: true,
          onActorSelect: (actor) => window.selections.push(actor?.name ?? null),
          headerActions: [{
            label: "Injected",
            icon: "copy",
            onActivate: () => { window.injectedHeaderActions += 1; },
          }],
        },
      );
      window.linesAndArrows = { renderDiagram };
    </script>
  </body>
</html>
